<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>Задание 2 - Таблица</title>

</head>


<body>


    <!-- =====================================================
         ГЛАВНАЯ ТАБЛИЦА
         ===================================================== -->

    <!-- Таблица без CSS: фон, ширина, рамки и отступы заданы атрибутами. -->
    <table width="600" align="center" border="2" bordercolor="red" bgcolor="gray" cellpadding="10" cellspacing="15" background="images-2.jpeg">
        <!-- Делим таблицу на три колонки одинаковой ширины. -->
        <colgroup>
            <col width="33%">
            <col width="33%">
            <col width="33%">
        </colgroup>


        <!-- =================================================
             ПЕРВЫЙ РЯД
             ================================================= -->

        <!-- Первая строка: изображение, пустая ячейка и ячейка с фоном. -->
        <tr height="100">


            <!-- 1-я ячейка -->

            <td width="200" align="center" valign="top">

                <img src="images-2.jpeg" width="50" height="50" alt="Dr Pepper">

                <div class="logo-text">
                    Логотип
                </div>

            </td>


            <!-- 2-я ячейка - пустая -->

            <td width="200">

            </td>


            <!-- 3-я ячейка -->
            <!-- ширина 200px + фоновая картинка -->

            <td width="200" background="images-2.jpeg">

            </td>


        </tr>



        <!-- =================================================
             ВТОРОЙ РЯД
             ================================================= -->

        <!-- colspan объединяет все три колонки в одну ячейку. -->
        <tr height="20">

            <!-- colspan="3" объединяет 3 столбца -->

            <td colspan="3">

            </td>

        </tr>



        <!-- =================================================
             ТРЕТИЙ РЯД
             ================================================= -->

        <!-- Широкая ячейка занимает две колонки, зеленая — третью. -->
        <tr height="300">


            <!-- 1-я ячейка шириной 400px -->

            <td width="400" colspan="2" valign="top">

                Большая ячейка
                <br>
                Ширина: 400px
                <br>
                Высота: 300px

            </td>


            <!-- 2-я ячейка с зелёным фоном -->

            <td width="200" bgcolor="green" valign="top">

                Зелёная ячейка

            </td>


        </tr>



        <!-- =================================================
             ЧЕТВЁРТЫЙ РЯД
             ================================================= -->

        <!-- В последней строке вложенная таблица занимает две колонки. -->
        <tr height="200">


            <!-- =================================================
                 ЛЕВАЯ ЯЧЕЙКА
                 ================================================= -->

            <td width="400" colspan="2" valign="top">


                <!-- Вложенная таблица -->

                <table width="100%" border="2" bordercolor="red" cellpadding="10" cellspacing="5">


                    <!-- Первая строка вложенной таблицы -->

                    <tr>

                        <!-- Верхняя левая ячейка -->

                        <td>

                            <img src="images-2.jpeg" width="100" alt="Dr Pepper в ячейке таблицы">

                        </td>


                        <!-- Верхняя правая ячейка -->

                        <td>

                        </td>

                    </tr>


                    <!-- Вторая строка вложенной таблицы -->

                    <tr>

                        <td>

                        </td>

                        <td>

                        </td>

                    </tr>


                </table>

            </td>



            <!-- =================================================
                 ПРАВАЯ ЯЧЕЙКА
                 ================================================= -->

            <td width="200" align="right" valign="top">

                <a href="images-2.jpeg" target="_blank" rel="noopener"><img src="images-2.jpeg" width="150" alt="Открыть оригинальное изображение Dr Pepper"></a>

            </td>


        </tr>


    </table>


</body>

</html>
